<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1530" viewBox="0 0 1000 1530"><rect width="1000" height="1530" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#397a85"/></marker></defs><text x="500" y="56" text-anchor="middle" font-family="sans-serif" font-size="35" font-weight="bold" fill="#183e58">Ubuntu Server Boot Process</text><text x="500" y="92" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="normal" fill="#183e58">Jaymark Viriña | ITEP 414 | Week 3</text><text x="500" y="128" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="normal" fill="#183e58">Logical flow - firmware path depends on the installation mode</text><rect x="105" y="176" width="790" height="112" rx="56" fill="#e9f3f0" stroke="#1b465f" stroke-width="2.5"/><text x="500" y="214" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#183e58">1. Power On</text><text x="500" y="252" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="normal" fill="#183e58">The VM receives virtual power; the processor starts firmware.</text><path d="M500 289 V310" stroke="#397a85" stroke-width="4"/><path d="M493 307 L500 319 L507 307 Z" fill="#397a85"/><rect x="105" y="327" width="790" height="112" rx="12" fill="#f1f5f8" stroke="#1b465f" stroke-width="2.5"/><text x="500" y="365" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#183e58">2. BIOS / UEFI Initialization</text><text x="500" y="403" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="normal" fill="#183e58">Firmware initializes hardware and performs startup checks.</text><path d="M500 440 V461" stroke="#397a85" stroke-width="4"/><path d="M493 458 L500 470 L507 458 Z" fill="#397a85"/><rect x="105" y="478" width="790" height="112" rx="12" fill="#f1f5f8" stroke="#1b465f" stroke-width="2.5"/><text x="500" y="516" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#183e58">3. Boot Device Detection</text><text x="500" y="554" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="normal" fill="#183e58">Firmware selects a boot entry or bootable device.</text><path d="M500 591 V612" stroke="#397a85" stroke-width="4"/><path d="M493 609 L500 621 L507 609 Z" fill="#397a85"/><rect x="105" y="629" width="790" height="112" rx="12" fill="#f1f5f8" stroke="#1b465f" stroke-width="2.5"/><text x="500" y="667" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#183e58">4. Boot Loader - GRUB</text><text x="500" y="705" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="normal" fill="#183e58">GRUB selects Linux and loads the kernel and initramfs.</text><path d="M500 742 V763" stroke="#397a85" stroke-width="4"/><path d="M493 760 L500 772 L507 760 Z" fill="#397a85"/><rect x="105" y="780" width="790" height="112" rx="12" fill="#f1f5f8" stroke="#1b465f" stroke-width="2.5"/><text x="500" y="818" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#183e58">5. Linux Kernel</text><text x="500" y="856" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="normal" fill="#183e58">Kernel initializes devices; initramfs helps mount the root filesystem.</text><path d="M500 893 V914" stroke="#397a85" stroke-width="4"/><path d="M493 911 L500 923 L507 911 Z" fill="#397a85"/><rect x="105" y="931" width="790" height="112" rx="12" fill="#f1f5f8" stroke="#1b465f" stroke-width="2.5"/><text x="500" y="969" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#183e58">6. init / systemd</text><text x="500" y="1007" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="normal" fill="#183e58">systemd runs as PID 1 and organizes userspace startup.</text><path d="M500 1044 V1065" stroke="#397a85" stroke-width="4"/><path d="M493 1062 L500 1074 L507 1062 Z" fill="#397a85"/><rect x="105" y="1082" width="790" height="112" rx="12" fill="#f1f5f8" stroke="#1b465f" stroke-width="2.5"/><text x="500" y="1120" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#183e58">7. Services Start</text><text x="500" y="1158" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="normal" fill="#183e58">Configured services and login-related targets start.</text><path d="M500 1195 V1216" stroke="#397a85" stroke-width="4"/><path d="M493 1213 L500 1225 L507 1213 Z" fill="#397a85"/><rect x="105" y="1233" width="790" height="112" rx="56" fill="#e9f3f0" stroke="#1b465f" stroke-width="2.5"/><text x="500" y="1271" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#183e58">8. Login Prompt</text><text x="500" y="1309" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="normal" fill="#183e58">The console accepts a user login; SSH is available when configured.</text><text x="500" y="1430" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="normal" fill="#183e58">UEFI may load shim before GRUB when using Secure Boot.</text><text x="500" y="1464" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="normal" fill="#183e58">Legacy BIOS reaches GRUB through its disk boot code.</text><text x="500" y="1500" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#183e58">Sources: GNU GRUB Manual; systemd bootup. Full references in references/Sources.md.</text></svg>